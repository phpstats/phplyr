project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "reference/*.qmd"
    - "examples/*.qmd"
  resources:
    - data/*.csv
    - benchmarks/*.json

website:
  site-url: "https://phplyr.phpstats.org/docs"
  title: "phplyr"
  repo-url: "https://github.com/phpstats/phplyr"
  sidebar:
    style: docked
    search: true
    contents:
      - index.qmd
      - getting-started.qmd
      - section: "Guides"
        contents:
          - coming-from-dplyr.qmd
          - port-r-script.qmd
      - section: "Reference"
        contents:
          - reference/single-table.qmd
          - reference/two-table.qmd
          - reference/grouping.qmd
          - reference/vectors.qmd
          - reference/strings-dates.qmd
          - reference/tidyselect.qmd
          - reference/tidyr.qmd
          - reference/janitor.qmd
          - reference/models.qmd
          - reference/databases.qmd
      - section: "Examples"
        contents:
          - examples/filter-and-mutate.qmd
          - examples/group-and-summarize.qmd
          - examples/join.qmd
          - examples/pivot.qmd
          - gallery.qmd
      - compatibility.qmd
      - performance.qmd
      - section: "Contributing"
        contents:
          - development.qmd

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    highlight-style: github
