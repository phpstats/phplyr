name: pages

# GitHub Pages serves redirects to phplyr.phpstats.org/docs. The rendered
# documentation stays in docs/, where phpstats.org imports it.

on:
  push:
    branches: [main]
    paths: ['docs/**', 'bin/pages-redirects', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - run: php bin/pages-redirects _pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - id: deployment
        uses: actions/deploy-pages@v4
