name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    name: test (PHP ${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - run: composer install --no-interaction --no-progress

      # Without phit, the descriptive helpers use pure PHP and the model
      # tests are skipped. bin/test leaves out tests/Pipe (|>) before PHP 8.5.
      - run: bin/test

  polars:
    # phplyr on phibble's PolarsTable, with the prebuilt php_polars extension
    # from the phpolars release (Linux, PHP 8.5 NTS, glibc >= 2.36).
    runs-on: ubuntu-24.04
    env:
      PHPOLARS_VERSION: v0.1.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Install php_polars
        run: |
          gh release download "$PHPOLARS_VERSION" -R phpstats/phpolars --pattern 'php_polars-*-x86_64-nts-bookworm.*'
          sha256sum -c php_polars-*.sha256
          tar -xzf php_polars-*.tar.gz
          sudo cp php_polars-*/php_polars.so "$(php-config --extension-dir)/"
          echo "extension=php_polars.so" | sudo tee "$(php -r "echo PHP_CONFIG_FILE_SCAN_DIR;")/90-php_polars.ini"
          php -r 'echo Phpolars\version(), "\n";'

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/pest tests/PolarsTest.php

  phit:
    # The model verbs and the native descriptive helpers, with the phit
    # extension built from phpstats/phit's main branch.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: none

      - uses: actions/checkout@v4
        with:
          repository: phpstats/phit
          path: phit

      - name: Build phit
        working-directory: phit
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev
          rustup update stable && rustup default stable
          PHP="$(command -v php)" PHP_CONFIG="$(command -v php-config)" cargo build -p phit --release --locked
          sudo cp target/release/libphit.so "$(php-config --extension-dir)/phit.so"
          echo "extension=phit.so" | sudo tee "$(php -r "echo PHP_CONFIG_FILE_SCAN_DIR;")/90-phit.ini"
          php -r 'var_dump(function_exists("Phit\\fit_lm"));'

      - run: composer install --no-interaction --no-progress

      - run: bin/test

  lint:
    # Held off until the last commit of this sequence turns the linter on.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: composer lint
